{% extends "base.html" %}

{% block content %}
<nav class="filter-bar" aria-label="Filter">
  <a class="filter-tab {% if query.filter() == "all" %}active{% endif %}" href="/?filter=all&sort={{ query.sort() }}">All</a>
  <a class="filter-tab {% if query.filter() == "opened" %}active{% endif %}" href="/?filter=opened&sort={{ query.sort() }}">Opened</a>
  <a class="filter-tab {% if query.filter() == "voted" %}active{% endif %}" href="/?filter=voted&sort={{ query.sort() }}">Voted</a>
  <span class="filter-sep" aria-hidden="true"></span>
  <a class="filter-tab {% if query.sort() == "new" %}active{% endif %}" href="/?filter={{ query.filter() }}&sort=new">Newest</a>
  <a class="filter-tab {% if query.sort() == "score" %}active{% endif %}" href="/?filter={{ query.filter() }}&sort=score">Top score</a>
</nav>

<form class="settings-bar" method="post" action="/settings">
  <label class="settings-label" for="explore-pct">Exploration</label>
  <input class="settings-input" id="explore-pct" type="number" name="explore_pct"
         min="0" max="100" step="1" value="{{ explore_pct }}">
  <span class="settings-unit" aria-hidden="true">%</span>
  <input type="hidden" name="filter" value="{{ query.filter() }}">
  <input type="hidden" name="sort" value="{{ query.sort() }}">
  <button class="settings-save" type="submit">Save</button>
  <button class="settings-save" type="submit" name="rescore" value="1">Rescore now</button>
</form>

<div id="news-list" class="news-list">
  {% include "cards.html" %}
</div>
{% endblock %}
