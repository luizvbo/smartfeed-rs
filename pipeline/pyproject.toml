[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartfeed-pipeline"
version = "0.1.0"
description = "RSS ingestion, multilingual embeddings, and preference-model scoring for the SmartFeed news reader."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SmartFeed" }]
dependencies = [
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "sentence-transformers>=3.0",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "torch>=2.4",
]

[project.optional-dependencies]
logistic = ["scikit-learn>=1.4"]

[tool.setuptools]
# This is a flat collection of scripts, not an importable package.
py-modules = ["config", "db", "rss", "embed", "model", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = []

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
