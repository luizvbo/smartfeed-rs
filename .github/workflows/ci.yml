name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04

    env:
      RUSTFLAGS: '-D warnings'
      RUSTDOCFLAGS: '-D warnings'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - run: rustup show

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --check --all
      - run: cargo clippy --all-targets --all-features
      - run: cargo doc --no-deps --document-private-items

  deps:
    name: Dependencies
    runs-on: ubuntu-24.04

    env:
      CARGO_MACHETE_VERSION: 0.9.2
      CARGO_AUDIT_VERSION: 0.22.2

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - run: rustup show

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-machete@${{ env.CARGO_MACHETE_VERSION }},cargo-audit@${{ env.CARGO_AUDIT_VERSION }},zizmor

      - run: cargo machete

      - run: cargo audit --db "$(mktemp -d -p "${RUNNER_TEMP}" cargo-audit-db-XXXXXX)"

      - run: zizmor .github/workflows

  test:
    name: Test
    runs-on: ubuntu-24.04

    env:
      RUST_BACKTRACE: 1
      RUSTFLAGS: '-D warnings'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - run: rustup show

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Run Rust tests with coverage
        run: cargo llvm-cov --all-features --workspace nextest --lcov --output-path lcov.info --ignore-filename-regex 'src/(main|bin/seed)\.rs' --fail-under-lines 80

  python-test:
    name: Python Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318f78e0c49f566a43a87239f6d # v5.3.0
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@f94e62d4a12df8abe8dd2084f454851cd88ac8b8 # v4.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --directory pipeline --group dev

      - name: Run Python tests with coverage
        working-directory: pipeline
        run: |
          uv run pytest \
            --cov=config --cov=db --cov=rss --cov=embed --cov=model \
            --cov-report=term --cov-fail-under=80 \
            tests
