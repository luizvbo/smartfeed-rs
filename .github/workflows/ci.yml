name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04

    env:
      RUSTFLAGS: '-D warnings'
      RUSTDOCFLAGS: '-D warnings'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - run: rustup show

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --check --all
      - run: cargo clippy --all-targets --all-features
      - run: cargo doc --no-deps --document-private-items

  deps:
    name: Dependencies
    runs-on: ubuntu-24.04

    env:
      CARGO_MACHETE_VERSION: 0.9.2
      CARGO_AUDIT_VERSION: 0.22.2

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - run: rustup show

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-machete@${{ env.CARGO_MACHETE_VERSION }},cargo-audit@${{ env.CARGO_AUDIT_VERSION }},zizmor

      - run: cargo machete

      - run: cargo audit --db "$(mktemp -d -p "${RUNNER_TEMP}" cargo-audit-db-XXXXXX)"

      - run: zizmor .github/workflows

  test:
    name: Test
    runs-on: ubuntu-24.04

    env:
      RUST_BACKTRACE: 1
      RUSTFLAGS: '-D warnings'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - run: rustup show

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo test --all-targets --all-features
